<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spidey Tracker GPS</title>
    
    <!-- Configuration PWA mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#122c38">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Police Pixel Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #122c38;
            color: #fff;
            font-family: 'Press Start 2P', monospace, sans-serif;
            margin: 0;
            padding: 4px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .gps-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #216278;
            border: 4px solid #103947;
            padding: 6px;
            height: 100%;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        /* En-tête */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #154656;
            border: 2px solid #0b2630;
            padding: 4px 6px;
            margin-bottom: 4px;
            font-size: 6px;
        }
        .header-center {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .spider-logo-box {
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            padding: 3px 6px;
            font-size: 7px;
            color: #111;
        }
        .top-right-icon {
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        /* Alerte Sighting */
        .alert-box {
            background-color: #f39c3f;
            color: #111;
            border: 2px solid #bd6819;
            text-align: center;
            padding: 5px;
            margin-bottom: 4px;
            font-size: 6px;
            font-weight: bold;
        }
        /* Corps central (Sidebar gauche + Map) */
        .main-body {
            display: flex;
            flex: 1;
            gap: 4px;
            margin-bottom: 4px;
            min-height: 200px;
        }
        .sidebar-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 32px;
        }
        .side-btn {
            background-color: #e74c3c;
            border: 2px solid #962d22;
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            text-align: center;
            padding: 4px 0;
        }
        .spider-avatar {
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-top: 4px;
        }
        #map {
            flex: 1;
            border: 3px solid #103947;
            background-color: #0b2630;
            /* Filtre intelligent pour transformer la carte en mode radar bleu nuit rétro */
            filter: invert(100%) hue-rotate(180deg) brightness(85%) contrast(130%);
        }
        /* Grille de boutons exacte (4 colonnes) */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 3px;
        }
        .btn {
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 5px;
            padding: 7px 1px;
            cursor: pointer;
            text-align: center;
            text-shadow: 1px 1px #8a410b;
        }
        .btn:active {
            background-color: #d68910;
        }
        .btn-green {
            background-color: #27ae60;
            border-color: #1e8449;
            text-shadow: 1px 1px #114e2c;
        }
        .btn-red {
            background-color: #e74c3c;
            border-color: #962d22;
            text-shadow: 1px 1px #641e16;
        }
        .status-text {
            font-size: 5px;
            text-align: center;
            color: #a9dfbf;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="gps-container">
    <!-- En-tête -->
    <div class="header-bar">

        <div class="header-center">
