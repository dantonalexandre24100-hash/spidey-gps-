<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spidey Tracker GPS</title>
    
    <!-- Configuration PWA pour mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#122c38">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Police Pixel Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #122c38;
            color: #fff;
            font-family: 'Press Start 2P', monospace, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .gps-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #216278;
            border: 4px solid #103947;
            padding: 8px;
            height: 100%;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #154656;
            border: 2px solid #0b2630;
            padding: 6px 8px;
            margin-bottom: 6px;
            font-size: 7px;
        }
        .alert-box {
            background-color: #f39c3f;
            color: #111;
            border: 2px solid #bd6819;
            text-align: center;
            padding: 6px;
            margin-bottom: 6px;
            font-size: 7px;
            font-weight: bold;
        }
        #map {
            flex: 1;
            width: 100%;
            border: 3px solid #103947;
            margin-bottom: 6px;
            background-color: #1a4f63;
            min-height: 250px;
        }
        .control-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }
        .btn {
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            padding: 10px 2px;
            cursor: pointer;
            text-align: center;
            text-shadow: 1px 1px #8a410b;
        }
        .btn:active {
            background-color: #d68910;
        }
        .btn-green {
            background-color: #27ae60;
            border-color: #1e8449;
            text-shadow: 1px 1px #114e2c;
        }
        .status-text {
            font-size: 6px;
            text-align: center;
            color: #a9dfbf;
            padding: 2px 0;
        }
    </style>
</head>
<body>

<div class="gps-container">
    <div class="header-bar">
        <span>SMT_1 SPIDEY TRACK</span>
        <span id="clock">00:00</span>
    </div>

    <div class="alert-box">
        NEW SIGHTING: LIVE GPS
    </div>

    <div id="map"></div>

    <div class="control-grid">
        <button class="btn btn-green" onclick="setProfile(1)">PROF 1</button>
        <button class="btn btn-green" onclick="setProfile(2)">PROF 2</button>
        <button class="btn btn-green" onclick="setProfile(3)">PROF 3</button>
        <button class="btn" onclick="toggleTerrain()">TERRAIN</button>
        
        <button class="btn" onclick="centerLocation()">CENTER</button>
        <button class="btn" onclick="alert('Mode Vue 3D actif')">3D VIEW</button>
        <button class="btn" onclick="shareLocation()">SHARE</button>
        <button class="btn" onclick="alert('Canal radio sécurisé vide.')">CHAT</button>
    </div>
    <div class="status-text" id="coords-status">Recherche GPS...</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Horloge dynamique
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = 
            String(now.getHours()).padStart(2, '0') + ':' + 
            String(now.getMinutes()).padStart(2, '0');
    }, 1000);

    // Initialisation de la carte
    let map = L.map('map', { zoomControl: false }).setView([48.8566, 2.3522], 15);

    let darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
    }).addTo(map);

    let streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    });

    let isTerrain = false;
    function toggleTerrain() {
        if (isTerrain) {
            map.removeLayer(streetLayer);
            darkLayer.addTo(map);
            isTerrain = false;
        } else {
            map.removeLayer(darkLayer);
            streetLayer.addTo(map);
            isTerrain = true;
        }
    }

    let userMarker = null;
    let accuracyCircle = null;

    // Suivi GPS temps réel adapté mobile
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            document.getElementById('coords-status').innerText = `LAT:${lat.toFixed(3)} LON:${lon.toFixed(3)} (±${Math.round(accuracy)}m)`;

            const currentLatLng = [lat, lon];

            if (!userMarker) {
                userMarker = L.marker(currentLatLng).addTo(map);
                accuracyCircle = L.circle(currentLatLng, { radius: accuracy, color: '#f39c3f', fillOpacity: 0.2 }).addTo(map);
                map.setView(currentLatLng, 17);
            } else {
                userMarker.setLatLng(currentLatLng);
                accuracyCircle.setLatLng(currentLatLng);
                accuracyCircle.setRadius(accuracy);
            }
        }, (error) => {
            document.getElementById('coords-status').innerText = "Erreur GPS : Activez la localisation";
        }, {
            enableHighAccuracy: true,
            maximumAge: 3000,
            timeout: 10000
        });
    } else {
        document.getElementById('coords-status').innerText = "GPS non disponible";
    }

    function centerLocation() {
        if (userMarker) {
            map.setView(userMarker.getLatLng(), 17);
        } else {
            alert("Verrouillage GPS en cours...");
        }
    }

    function setProfile(num) {
        alert("Profil " + num + " activé.");
    }

    function shareLocation() {
        if (userMarker) {
            const pos = userMarker.getLatLng();
            const shareUrl = `https://www.openstreetmap.org/?mlat=${pos.lat}&mlon=${pos.lng}#map=17/${pos.lat}/${pos.lng}`;
            if (navigator.share) {
                navigator.share({ title: 'Spidey Tracker', text: 'Ma position en direct :', url: shareUrl });
            } else {
                navigator.clipboard.writeText(shareUrl);
                alert("Lien copié !");
            }
        }
    }
</script>
</body>
</html>
