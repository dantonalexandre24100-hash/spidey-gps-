<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spidey Tracker GPS</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#12303c">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Police Pixel Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #0b1a22;
            color: #fff;
            font-family: 'Press Start 2P', monospace, sans-serif;
            margin: 0;
            padding: 4px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Boîtier extérieur du tracker */
        .device-frame {
            background-color: #216278;
            border: 5px solid #103947;
            box-shadow: inset 0 0 0 2px #4b8ca3, 0 6px 0 #081d28;
            border-radius: 4px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 6px;
            gap: 4px;
        }

        /* En-tête HUD supérieur exact */
        .hud-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #154656;
            border: 2px solid #0b2630;
            padding: 3px 4px;
            font-size: 5px;
        }
        .hud-left {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #aee1f0;
        }
        .hud-left-icon {
            background-color: #216278;
            border: 1px solid #7ac5d8;
            padding: 2px 4px;
            font-size: 7px;
        }
        .hud-timers-container {
            display: flex;
            align-items: center;
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            color: #111;
            padding: 2px 6px;
            font-size: 6px;
            font-weight: bold;
            gap: 4px;
        }
        .hud-center-mask {
            background-color: #e85338;
            border: 1px solid #000;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
        }
        .hud-right-spider-box {
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: 1px 1px 0 #000;
        }

        /* Bannière d'alerte New Sighting */
        .alert-banner {
            background-color: #f39c3f;
            border: 2px solid #bd6819;
            text-align: center;
            padding: 4px;
            font-size: 6px;
            color: #111;
            font-weight: bold;
            line-height: 1.2;
        }

        /* Corps central : Sidebar gauche (0, S, T) + Carte */
        .screen-area {
            display: flex;
            flex: 1;
            gap: 4px;
            min-height: 180px;
            position: relative;
        }

        /* Sidebar gauche avec onglets tagués 0, S, T */
        .sidebar-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
            width: 26px;
            align-items: center;
        }
        .tag-btn {
            background-color: #e85338;
            border: 2px solid #962d22;
            color: white;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            text-align: center;
            width: 100%;
            padding: 4px 0;
            box-shadow: 1px 1px 0 #000;
        }
        .sidebar-avatars {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 3px;
            align-items: center;
        }
        .avatar-circle {
            background-color: #e85338;
            border: 2px solid #962d22;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            box-shadow: 1px 1px 0 #000;
        }

        /* Zone de la carte */
        .map-frame {
            flex: 1;
            border: 3px solid #103947;
            background-color: #081d28;
            position: relative;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #081d28;
            filter: invert(100%) hue-rotate(170deg) brightness(80%) contrast(150%);
        }

        /* Grille de contrôle inférieure (4 colonnes) */
        .control-panel {
            background-color: #154656;
            border: 2px solid #0b2630;
            padding: 4px;
            display: grid;
            grid-template-columns: 0.8fr 1.2fr 1.2fr 1.2fr;
            gap: 3px;
        }
        .btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 5px;
            padding: 7px 1px;
            border: 2px solid #bd6819;
            text-align: center;
            cursor: pointer;
            box-shadow: 1px 1px 0 #000;
            color: #fff;
        }
        .btn:active {
            transform: translate(1px, 1px);
        }
        .btn-orange {
            background-color: #f39c3f;
            color: #111;
            font-weight: bold;
        }
        .btn-green {
            background-color: #27ae60;
            border-color: #1e8449;
        }
        .btn-red {
            background-color: #e85338;
            border-color: #962d22;
        }

        .status-footer {
            font-size: 5px;
            text-align: center;
            color: #a9dfbf;
        }
    </style>
</head>
<body>

<div class="device-frame">
    <!-- En-tête HUD supérieur -->
    <div class="hud-top-bar">
        <div class="hud-left">
            <div class="hud-left-icon">🕷️</div>
            <span>SMT_1 ///</span>
        </div>
        <div class="hud-timers-container">
            <span id="clock-left">00:00</span>
            <div class="hud-center-mask">🕷️</div>
            <span id="clock-right">00:00</span>
        </div>
        <div class="hud-right-spider-box">🕷️</div>
    </div>

    <!-- Bannière d'alerte Sighting -->
    <div class="alert-banner" id="location-banner">
        NEW SIGHTING<br>LOCATION: ????
    </div>

    <!-- Section centrale (Barre 0, S, T + Carte) -->
    <div class="screen-area">
        <div class="sidebar-left">
            <div class="tag-btn">0</div>
            <div class="tag-btn">S</div>
            <div class="tag-btn">T</div>
            <div class="sidebar-avatars">
                <div class="avatar-circle" style="background-color: #f39c3f;">🕷️</div>
                <div class="avatar-circle">🕷️</div>
            </div>
        </div>
        <div class="map-frame">
            <div id="map"></div>
        </div>
    </div>

    <!-- Grille de commandes inférieure -->
    <div class="control-panel">
        <button class="btn btn-red" onclick="alert('Option A.1 active')">A.1</button>
        <button class="btn btn-green" onclick="setProfile(1)">PROF 1</button>
        <button class="btn btn-orange" onclick="toggleMapStyle()">TERRAIN</button>
        <button class="btn btn-orange" onclick="alert('Canal de chat sécurisé')">CHAT</button>

        <button class="btn btn-red" onclick="alert('Option A.2 active')">A.2</button>
        <button class="btn btn-green" onclick="setProfile(2)">PROF 2</button>
        <button class="btn btn-orange" onclick="alert('Vue 3D active')">3D VIEW</button>
        <button class="btn btn-orange" onclick="alert('Archives vides')">ARCHIVE</button>

        <div></div>
        <button class="btn btn-green" onclick="setProfile(3)">PROF 3</button>
        <button class="btn btn-orange" onclick="centerGPS()">CENTER LOC.</button>
        <button class="btn btn-orange" onclick="sharePos()">SHARE</button>
    </div>

    <div class="status-footer" id="gps-status">RECHERCHE SATELLITE...</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    setInterval(() => {

        const timeStr = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        document.getElementById('clock-left').innerText = timeStr;
        document.getElementById('clock-right').innerText = timeStr;
    }, 1000);
