<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spidey Tracker GPS</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4b8ca3">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Police Pixel Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #1a3340;
            color: #000;
            font-family: 'Press Start 2P', monospace, sans-serif;
            margin: 0;
            padding: 6px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Boîtier extérieur bleu clair */
        .device-frame {
            background-color: #6fb2c6;
            border: 6px solid #2d5a6b;
            box-shadow: inset 0 0 0 3px #aee1f0, 0 8px 0 #152c38;
            border-radius: 8px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 8px;
            gap: 6px;
        }

        /* En-tête avec masques Spidey & Horloges */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #5593a8;
            border: 3px solid #2d5a6b;
            padding: 4px 6px;
        }
        .spidey-icon {
            width: 26px;
            height: 26px;
            background-color: #e85338;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            box-shadow: 2px 2px 0 #000;
        }
        .header-title {
            font-size: 7px;
            color: #ffffff;
            text-shadow: 1px 1px 0 #000;
        }
        .clock-display {
            font-size: 8px;
            color: #fff;
            background: #2d5a6b;
            padding: 3px 5px;
            border: 2px solid #000;
        }

        /* Bannière d'alerte Orange */
        .alert-banner {
            background-color: #ff9d3b;
            border: 3px solid #000;
            box-shadow: inset 0 0 0 2px #ffc175;
            text-align: center;
            padding: 6px;
            font-size: 7px;
            color: #000;
            font-weight: bold;
            line-height: 1.3;
        }

        /* Section centrale : Barre latérale + Carte GPS */
        .screen-area {
            display: flex;
            flex: 1;
            gap: 6px;
            min-height: 200px;
            position: relative;
        }

        /* Sidebar gauche avec onglets '0', 'S', 'T' */
        .side-bar {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 30px;
        }
        .side-tab {
            background-color: #e85338;
            border: 2px solid #000;
            color: #fff;
            font-size: 8px;
            text-align: center;
            padding: 6px 0;
            box-shadow: 2px 2px 0 #000;
        }
        .side-avatar {
            margin-top: auto;
            background-color: #e85338;
            border: 2px solid #000;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Conteneur de carte stylisé */
        .map-frame {
            flex: 1;
            border: 4px solid #000;
            background-color: #081d28;
            position: relative;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #081d28;
            /* Filtre de couleur bleu nuit / rétrofuturiste */
            filter: invert(100%) hue-rotate(170deg) brightness(80%) contrast(150%);
        }

        /* Panneau inférieur de contrôles */
        .control-panel {
            background-color: #5593a8;
            border: 3px solid #2d5a6b;
            padding: 6px;
            display: grid;
            grid-template-columns: 0.8fr 1.2fr 1.2fr 1.2fr;
            gap: 4px;
        }

        .btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            padding: 8px 2px;
            border: 2px solid #000;
            text-align: center;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
            color: #000;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0 0 0 #000;
        }

        .btn-orange {
            background-color: #ff9d3b;
        }
        .btn-green {
            background-color: #61d07c;
        }
        .btn-red {
            background-color: #e85338;
            color: #fff;
        }

        .status-footer {
            font-size: 5px;
            text-align: center;
            color: #12303c;
            padding-top: 2px;
        }
    </style>
</head>
<body>

<div class="device-frame">
    <!-- En-tête -->
    <div class="top-header">
        <div class="spidey-icon">🕷️</div>
        <div class="header-title">SMT_1 SPIDEY TRACK</div>
        <div class="clock-display" id="clock">00:00</div>
        <div class="spidey-icon" style="background-color: #ff9d3b;">🕷️</div>
    </div>

    <!-- Alerte type modèle -->
    <div class="alert-banner" id="location-banner">
        NEW SIGHTING<br>LOCATION: LOCKING GPS...
    </div>

    <!-- Zone d'affichage central -->
    <div class="screen-area">
        <div class="side-bar">
            <div class="side-tab">0</div>
            <div class="side-tab">S</div>
            <div class="side-tab">T</div>
            <div class="side-avatar">🕷️</div>
        </div>
        <div class="map-frame">
            <div id="map"></div>
        </div>
    </div>

    <!-- Grille de commandes 4 colonnes exacte -->
    <div class="control-panel">
        <button class="btn btn-red" onclick="alert('Option A.1')">A.1</button>
        <button class="btn btn-green" onclick="setProfile(1)">PROF 1</button>
        <button class="btn btn-orange" onclick="toggleMapStyle()">TERRAIN</button>
        <button class="btn btn-orange" onclick="alert('Chat radio actif')">CHAT</button>

        <button class="btn btn-red" onclick="alert('Option A.2')">A.2</button>
        <button class="btn btn-green" onclick="setProfile(2)">PROF 2</button>
        <button class="btn btn-orange" onclick="alert('Vue 3D simulée')">3D VIEW</button>
        <button class="btn btn-orange" onclick="alert('Archives vides')">ARCHIVE</button>

        <div></div>
        <button class="btn btn-green" onclick="setProfile(3)">PROF 3</button>
        <button class="btn btn-orange" onclick="centerGPS()">CENTER LOC.</button>
        <button class="btn btn-orange" onclick="sharePos()">SHARE</button>
    </div>

    <div class="status-footer" id="gps-status">RECHERCHE DE SATELLITES...</div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Horloge
    setInterval(() => {
        const d = new Date();
        document.getElementById('clock').innerText = 
            String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }, 1000);

    // Initialisation de la carte Leaflet
    const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([48.8566, 2.3522], 15);

    // Couche cartographique OpenStreetMap
    let mapTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    // Icône personnalisée Araignée pour le joueur
    const spiderIcon = L.divIcon({
        className: 'custom-spider-marker',
        html: '<div style="background:#e85338; border:2px solid #000; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 0 8px #ff9d3b;">🕷️</div>',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });

    let marker = null;
    let circle = null;

    // Géolocalisation réelle
    if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition((pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const acc = pos.coords.accuracy;

            const latLng = [lat, lng];

            document.getElementById('gps-status').innerText = `LAT: ${lat.toFixed(4)} | LON: ${lng.toFixed(4)}`;
            document.getElementById('location-banner').innerHTML = `NEW SIGHTING<br>LOCATION: ${lat.toFixed(3)}, ${lng.toFixed(3)}`;

            if (!marker) {
                marker = L.marker(latLng, { icon: spiderIcon }).addTo(map);
                circle = L.circle(latLng, { radius: acc, color: '#ff9d3b', fillColor: '#ff9d3b', fillOpacity: 0.25 }).addTo(map);
                map.setView(latLng, 16);
            } else {
                marker.setLatLng(latLng);
                circle.setLatLng(latLng);
                circle.setRadius(acc);
            }
        }, (err) => {
            document.getElementById('gps-status').innerText = "ERREUR GPS : VÉRIFIEZ VOTRE LOCALISATION";
        }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
    }

    function centerGPS() {
        if (marker) map.setView(marker.getLatLng(), 16);
    }

    function setProfile(num) {
        alert("Profil Spidey " + num + " sélectionné.");
    }

    let isDarkFilter = true;
    function toggleMapStyle() {
        const mapEl = document.getElementById('map');
        if (isDarkFilter) {
            mapEl.style.filter = "none";
            isDarkFilter = false;
        } else {
            mapEl.style.filter = "invert(100%) hue-rotate(170deg) brightness(80%) contrast(150%)";
            isDarkFilter = true;
        }
    }

    function sharePos() {
        if (marker) {
            const p = marker.getLatLng();
            const url = `https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lng}#map=16/${p.lat}/${p.lng}`;
            if (navigator.share) {
                navigator.share({ title: 'Spidey Tracker', text: 'Position actuelle :', url: url });
            } else {
                navigator.clipboard.writeText(url);
                alert("Lien copié !");
            }
        }
    }
</script>
</body>
</html>
